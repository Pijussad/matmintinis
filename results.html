<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Treniruočių rezultatai</title>
<style>
  html,body{margin:0;padding:0;background:#40C060;font-family:Arial;color:#004000}
  #trenhdr{position:absolute;left:6px;top:4px;color:#E00000;font-weight:bold;font-size:16px}
  .wrap{margin:40px auto 30px;max-width:760px;background:#fff;border:1px solid #999;padding:20px 24px}
  h1{font-family:"Times New Roman",Georgia,serif;color:#2e7d32;margin:0 0 4px;font-size:28px}
  .sub{color:#8b0000;font-style:italic;font-size:14px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border-bottom:1px solid #ccc;padding:7px 8px;text-align:left}
  th{background:#eef6ef;font-weight:bold}
  td.num{text-align:right;font-family:"Courier New",monospace;font-weight:bold}
  .empty{color:#666;padding:18px 0}
  .bar{margin-top:16px;display:flex;gap:10px}
  .btn{display:inline-block;background:#E00000;color:#fff;border:1px solid #fff;font-weight:bold;padding:8px 14px;cursor:pointer;text-decoration:none;font-size:14px}
  .btn.g{background:#007a00}
  .btn.gray{background:#777}
</style>
</head>
<body>
<div id="trenhdr">Treniruotės laukas</div>
<div class="wrap">
  <h1>Treniruočių rezultatai</h1>
  <div class="sub">Matmintinis &middot; paskutiniai rezultatai (išsaugomi šiame naršyklėje)</div>
  <table id="tbl">
    <thead><tr><th>Data</th><th>Pratimas</th><th style="text-align:right">Taškai</th><th style="text-align:right">Lygis</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">Rezultatų dar nėra. Sužaiskite vieną pratimą ir rezultatas atsiras čia.</div>
  <div class="bar">
    <a class="btn g" href="index.html">Grįžti į treniruotės lauką</a>
    <button class="btn gray" onclick="clearAll()">Išvalyti rezultatus</button>
  </div>
</div>
<script>
function load(){
  var a=[]; try{ a=JSON.parse(localStorage.getItem('mm_results')||'[]'); }catch(e){}
  var tb=document.getElementById('tb'); tb.innerHTML='';
  if(!a.length){ document.getElementById('empty').style.display='block'; return; }
  document.getElementById('empty').style.display='none';
  a.slice().reverse().forEach(function(r){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+r.date+'</td><td>'+r.name+'</td><td class="num">'+r.pts+'</td><td class="num">'+r.lvl+'</td>';
    tb.appendChild(tr);
  });
}
function clearAll(){
  if(confirm('Išvalyti visus rezultatus?')){ try{ localStorage.removeItem('mm_results'); }catch(e){} load(); }
}
load();
</script>
</body>
</html>
