  window.__owl=function(){ show(owl,'o'); };
  window.__bear=function(){ show(bear,'b'); };
  var okc=0;

<script>
/* --- result saving + local finish (overrides earlier finishLocal) --- */
function saveResult(name, pts, lvl){
  try{
    var a=JSON.parse(localStorage.getItem('mm_results')||'[]');
    var d=new Date();
    function z(n){return (n<10?'0':'')+n;}
    var ds=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
    a.push({date:ds,name:name,pts:pts,lvl:lvl});
    localStorage.setItem('mm_results', JSON.stringify(a.slice(-300)));
  }catch(e){}
}
function __exerciseName(){
  try{
    var q={}; new URLSearchParams(location.search).forEach(function(v,k){q[k]=v;});
    var names={1:'Sudėtis',2:'Atimtis',3:'Sudėtis ir atimtis',4:'Daugyba',5:'Dalyba',6:'Daugyba ir dalyba',7:'Visi veiksmai'};
    var who=(location.pathname.indexOf('int')>=0)?' (sveikieji)':' (natūralūs)';
    return (names[q.valik]||'Pratimas')+who;
  }catch(e){ return 'Pratimas'; }
}
function finishLocal(){
  try{ saveResult(__exerciseName(), UKokku, Tase); }catch(e){}
  try{ alert('Rezultatas: ' + UKokku + ' taškų\nPasiektas lygis: ' + Tase + '\n\nAčiū už žaidimą!'); }catch(e){}
  location.href='index.html';
}
</script>

<script>
/* --- live, per-session result capture (upsert) --- */
(function(){
  window.__sid = window.__sid || (Date.now()+'-'+Math.random().toString(36).slice(2));
  function nowStr(){var d=new Date();function z(n){return(n<10?'0':'')+n;}return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}
  window.saveResult=function(name,pts,lvl){
    try{
      var a=JSON.parse(localStorage.getItem('mm_results')||'[]'); var id=window.__sid, found=false;
      for(var i=0;i<a.length;i++){ if(a[i].sid===id){ a[i].pts=pts; a[i].lvl=lvl; a[i].date=nowStr(); a[i].name=name; found=true; break; } }
      if(!found) a.push({sid:id,date:nowStr(),name:name,pts:pts,lvl:lvl});
      localStorage.setItem('mm_results',JSON.stringify(a.slice(-300)));
    }catch(e){}
  };
  function nameOf(){
    var q={}; try{ new URLSearchParams(location.search).forEach(function(v,k){q[k]=v;}); }catch(e){}
    if(location.pathname.indexOf('cmp')>=0) return 'Palyginimas (natūralūs)';
    if(location.pathname.indexOf('fill')>=0) return 'Reikšmių įstatymas (natūralūs)';
    var names={1:'Sudėtis',2:'Atimtis',3:'Sudėtis ir atimtis',4:'Daugyba',5:'Dalyba',6:'Daugyba ir dalyba',7:'Visi veiksmai'};
    return (names[q.valik]||'Pratimas')+((location.pathname.indexOf('int')>=0)?' (sveikieji)':' (natūralūs)');
  }
  function started(){
    if(typeof running!=='undefined') return !!running;
    if(typeof Alus!=='undefined') return Alus>=2;
    return true;
  }
  function capture(){
    if(!started()) return;
    try{
      if(typeof UKokku!=='undefined') window.saveResult(nameOf(), UKokku, Tase);
      else if(typeof Kokku!=='undefined') window.saveResult(nameOf(), Kokku, Tase);
    }catch(e){}
  }
  setInterval(capture, 2000);
  window.addEventListener('beforeunload', capture);
})();
</script>
